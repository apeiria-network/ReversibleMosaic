[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3.0,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "reversible-mosaic"
version = "0.1.0"
description = "Offline reversible visual scrambling for Android"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=2.0,<3",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]
app = [
    "Kivy>=2.3,<3",
    "kivymd>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["reversible_mosaic*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: resource-intensive tests",
    "android: tests requiring Android",
]

[tool.coverage.run]
branch = true
source = ["reversible_mosaic"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reversible_mosaic"]

[[tool.mypy.overrides]]
module = ["kivy.*", "kivymd.*"]
ignore_missing_imports = true
